name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: format, analyze, test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported SDK (pubspec.yaml) and a pinned current stable.
        sdk: ['3.8.0', '3.13.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The formatter's style follows the SDK version, so format is checked
      # on the pinned current SDK only.
      - if: matrix.sdk == '3.13.5'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: pub publish dry run
        run: dart pub publish --dry-run
      - name: examples are generated and wired (no SDK present)
        run: |
          dart run husk_sdk -C example/acme_widget check
          dart run husk_sdk -C example/native_app check

  example-android:
    name: example, Android debug, with and without the fake SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: dart pub get
      - name: build without the SDK (stub)
        working-directory: example/acme_widget/example
        run: flutter build apk --debug
      - name: the stub build has no vendor classes
        working-directory: example/acme_widget/example
        run: |
          ! unzip -p build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' | grep -a -q 'Lcom/acme/widget/AcmeWidget;'
      # The native example reuses the Gradle wrapper that the Flutter build
      # above put in place, so it needs no extra setup.
      - name: native example, build without the SDK (stub)
        run: |
          sh example/acme_widget/example/android/gradlew -p example/native_app/android assembleDebug
          apk=example/native_app/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$apk" 'classes*.dex' | grep -a -q 'Lcom/example/native_app/AcmeGreeter;'
          ! unzip -p "$apk" 'classes*.dex' | grep -a -q 'Lcom/acme/widget/AcmeWidget;'
      - name: build the fake SDK and link it
        run: |
          example/fake_vendor_sdk/build.sh android
          dart run husk_sdk -C example/acme_widget link --from example/fake_vendor_sdk/dist
          dart run husk_sdk -C example/acme_widget check --require-sdk android
      - name: build with the SDK
        working-directory: example/acme_widget/example
        run: |
          flutter build apk --debug
          unzip -p build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' | grep -a -q 'Lcom/acme/widget/AcmeWidget;'
      - name: native example, build with the SDK
        run: |
          dart run husk_sdk -C example/native_app link --from example/fake_vendor_sdk/dist
          dart run husk_sdk -C example/native_app check --require-sdk android
          sh example/acme_widget/example/android/gradlew -p example/native_app/android assembleDebug
          unzip -p example/native_app/android/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | grep -a -q 'Lcom/acme/widget/AcmeWidget;'

  example-ios:
    name: example, iOS simulator, with and without the fake SDK
    # macOS minutes are expensive: run on main and on demand, not per PR.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: dart pub get
      - name: build without the SDK (stub)
        working-directory: example/acme_widget/example
        run: flutter build ios --simulator --debug --no-codesign
      - name: native example, build the Swift package without the SDK (stub)
        working-directory: example/native_app/ios/AcmeWidgetSDKHusk
        run: |
          xcodebuild -scheme AcmeWidgetSDKHusk -destination 'generic/platform=iOS Simulator' build | tee "$RUNNER_TEMP/native-stub.log"
          ! grep -q HUSK_ACMEWIDGETSDK "$RUNNER_TEMP/native-stub.log"
      - name: build the fake SDK and link it
        run: |
          example/fake_vendor_sdk/build.sh ios
          # The stub build above cached the evaluated Package.swift; clear it
          # so the next build sees the linked binary (doc/traps.md).
          dart run husk_sdk -C example/acme_widget link --from example/fake_vendor_sdk/dist --clear-swiftpm-cache
          dart run husk_sdk -C example/acme_widget check --require-sdk ios
      - name: build with the SDK
        working-directory: example/acme_widget/example
        run: |
          flutter build ios --simulator --debug --no-codesign
          strings -a build/ios/iphonesimulator/Runner.app/Runner.debug.dylib | grep -q 'from AcmeWidgetSDK'
      - name: native example, build the Swift package with the SDK
        run: |
          dart run husk_sdk -C example/native_app link --from example/fake_vendor_sdk/dist --clear-swiftpm-cache
          dart run husk_sdk -C example/native_app check --require-sdk ios
          cd example/native_app/ios/AcmeWidgetSDKHusk
          xcodebuild -scheme AcmeWidgetSDKHusk -destination 'generic/platform=iOS Simulator' build | tee "$RUNNER_TEMP/native-linked.log"
          grep -q HUSK_ACMEWIDGETSDK "$RUNNER_TEMP/native-linked.log"
