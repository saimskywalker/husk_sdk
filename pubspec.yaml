name: husk_sdk
description: >-
  Build Flutter plugins with or without a closed-source native SDK. A Dart CLI
  that generates SwiftPM, CocoaPods and Gradle wiring that links a vendor
  xcframework and AAR when present and a stub otherwise.
version: 0.2.0
repository: https://github.com/saimskywalker/husk_sdk
issue_tracker: https://github.com/saimskywalker/husk_sdk/issues
topics:
  - flutter
  - ios
  - android
  - swiftpm
  - ci

environment:
  sdk: ^3.8.0

executables:
  husk_sdk:

dependencies:
  archive: ^4.0.0
  args: ^2.7.0
  path: ^1.9.1
  xml: '>=6.6.1 <8.0.0'
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
